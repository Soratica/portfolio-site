# portfolio-site: the panel, its live status feed, and least-privilege RBAC.
# Apply with: kubectl apply -f deploy/k8s.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: portfolio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-site
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-site
  template:
    metadata:
      labels:
        app: portfolio-site
    spec:
      automountServiceAccountToken: false
      containers:
        - name: portfolio-site
          image: docker.io/library/portfolio-site:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: status
              mountPath: /usr/share/nginx/html/status
              readOnly: true
      volumes:
        - name: status
          projected:
            sources:
              - configMap: { name: portfolio-status, optional: true }
              - configMap: { name: portfolio-host, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-site
  namespace: portfolio
spec:
  selector:
    app: portfolio-site
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-site
  namespace: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-site
                port:
                  number: 80
    - host: portfolio.timbacloudpanel.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-site
                port:
                  number: 80
---
# Data is written at runtime (status CronJob); apply never touches it.
