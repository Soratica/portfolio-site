# Cloudflare's CF-Ray header ends in the edge location code, e.g. 8c1f...-SJC
map $http_cf_ray $cf_edge {
    default          "";
    "~-(?<code>[A-Z]{3})$" $code;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    }

    # Live readings: ConfigMaps mounted read-only, never cached.
    location /status/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The pod that served this request and the Cloudflare edge it came through.
    location = /status/route {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"pod":"$hostname","edge":"$cf_edge"}';
    }
}
